name: Delete posted videos

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Delete posted videos
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/delete_posted_videos.py

      - name: Commit cleared log
        run: |
          git config user.name "youtube-shorts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/posted_log.json
          git diff --cached --quiet || git commit -m "Clear posted log after deleting videos [skip ci]"
          git push
