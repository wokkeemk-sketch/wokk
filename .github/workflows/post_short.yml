name: Post daily YouTube Short

on:
  schedule:
    - cron: "0 16 * * *" # 16:00 UTC daily
  workflow_dispatch: {} # allows manual "Run workflow" for testing

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY_STATUS: ${{ vars.PRIVACY_STATUS || 'private' }}
        run: python scripts/run_pipeline.py

      - name: Commit updated posted log
        run: |
          git config user.name "youtube-shorts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/posted_log.json
          git diff --cached --quiet || git commit -m "Log posted short [skip ci]"
          git push
